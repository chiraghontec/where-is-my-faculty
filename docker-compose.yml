version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wimf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wimf
      POSTGRES_PASSWORD: wimf_dev_password
      POSTGRES_DB: faculty_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wimf -d faculty_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wimf_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://wimf:wimf_dev_password@postgres:5432/faculty_db
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      SYNC_INTERVAL_MINUTES: 5
      SYNC_CONCURRENCY: 10
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wimf_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
      VITE_USE_MOCK_DATA: 'false'

volumes:
  postgres_data:
